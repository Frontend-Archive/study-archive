name: Redeploy archive
on:
  repository_dispatch:
    types: [archive-updated]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel 재배포 호출
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
